name: Generate Green Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate green snake
        uses: Platane/snk@v3
        with:
          github_user_name: KuunalMistry
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2339D353&color_dots=%23000000,%230E4429,%23006D32,%2326A641,%2339D353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339D353&color_dots=%23000000,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
